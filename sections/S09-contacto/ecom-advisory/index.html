<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S09 · Contacto (Final Contact) — Ecom Advisory</title>
  <link rel="stylesheet" href="../../../assets/css/base.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="font-set-4">

  <!--
    Split clásico: izq gradient brand con título + info contacto + mapa,
    der formulario sobre fondo blanco.
  -->
  <section class="contact-eca theme-indigo">
    <div class="contact-eca__container">
      <div class="contact-eca__box">

        <!-- Lado izquierdo: gradient + info -->
        <aside class="contact-eca__visual">
          <div class="contact-eca__noise" aria-hidden="true"></div>
          <div class="contact-eca__visual-inner">
            <h2 class="contact-eca__title text-balance">
              Da el paso hacia el control real de tu
              <span class="nowrap">e-commerce</span>
            </h2>
            <p class="contact-eca__subtitle">
              Te acompañamos para que crezcas sin perder margen ni dormir con miedo a Hacienda.
            </p>

            <ul class="contact-eca__info">
              <li class="contact-eca__row">
                <span class="contact-eca__ico" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                  </svg>
                </span>
                <p>Calle Velázquez 34, 1º Izq<br>28001 Madrid</p>
              </li>
              <li class="contact-eca__row">
                <span class="contact-eca__ico" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                  </svg>
                </span>
                <p>hola@ecomadvisory.com</p>
              </li>
              <li class="contact-eca__row">
                <span class="contact-eca__ico" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                </span>
                <p>+34 910 123 456</p>
              </li>
            </ul>

            <div class="contact-eca__map">
              <iframe
                title="Mapa Ecom Advisory"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3037.38!2d-3.6876!3d40.4223!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422899dc688863%3A0x6280be142997c413!2sC.%20de%20Vel%C3%A1zquez%2C%2034%2C%2028001%20Madrid!5e0!3m2!1ses!2ses!4v1645555555555!5m2!1ses!2ses"
                width="100%" height="200" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
            </div>

            <div class="contact-eca__social" aria-label="Redes sociales">
              <a href="#" aria-label="LinkedIn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
              </a>
              <a href="#" aria-label="Instagram">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              </a>
              <a href="#" aria-label="Twitter">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/></svg>
              </a>
            </div>
          </div>
        </aside>

        <!-- Lado derecho: form -->
        <div class="contact-eca__form-side">
          <form class="form-eca">
            <h3 class="form-eca__title">Solicitar Diagnóstico Final</h3>

            <div class="form-eca__group">
              <label for="eca-name">Nombre</label>
              <input type="text" id="eca-name" name="nombre" placeholder="Tu nombre" required />
            </div>

            <div class="form-eca__group">
              <label for="eca-email">Email</label>
              <input type="email" id="eca-email" name="email" placeholder="nombre@empresa.com" required />
            </div>

            <div class="form-eca__group">
              <label for="eca-phone">Teléfono</label>
              <input type="tel" id="eca-phone" name="telefono" placeholder="+34 …" />
            </div>

            <div class="form-eca__group">
              <label for="eca-msg">Reto actual</label>
              <textarea id="eca-msg" name="mensaje" rows="3" placeholder="Breve descripción…"></textarea>
            </div>

            <div class="form-eca__checkbox">
              <input type="checkbox" id="eca-privacy" name="privacy" required />
              <label for="eca-privacy">He leído y acepto la <a href="#">Política de Privacidad</a></label>
            </div>

            <button type="submit" class="form-eca__submit">Hablar con un asesor especializado</button>
          </form>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
