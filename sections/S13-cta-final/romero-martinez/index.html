<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S13 · CTA Final (Newsletter Card) — Romero Martínez</title>
  <link rel="stylesheet" href="../../../assets/css/base.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="font-set-1">

  <section class="newsletter-rm theme-indigo">
    <div class="newsletter-rm__container">
      <div class="newsletter-rm__card">
        <div class="newsletter-rm__overlay" aria-hidden="true"></div>
        <div class="newsletter-rm__content">
          <h2 class="newsletter-rm__title text-balance">
            Mantente al día de las últimas novedades con
            <span class="newsletter-rm__highlight">Romero Martínez Asesores</span>
          </h2>
          <p class="newsletter-rm__desc text-pretty">
            Descubre cómo podemos ayudarte a optimizar tus impuestos y gestión
            para impulsar el crecimiento de tu negocio.
          </p>
          <a href="#contact" class="newsletter-rm__btn">Solicitar información</a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
