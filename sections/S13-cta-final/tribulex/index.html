<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S13 · CTA Final — Tribulex</title>
  <link rel="stylesheet" href="../../../assets/css/base.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="font-set-4">

  <!--
    Split: izquierda dark con eyebrow gold, h2 grande, CTAs y teléfono;
    barra gold vertical en el extremo izq. Derecha: foto real con overlay
    que se hace transparente hacia la derecha. Hover en la sección zooma la foto.
  -->
  <section class="cta-tbx theme-steel" id="contacto">

    <!-- Columna texto -->
    <div class="cta-tbx__text">
      <div class="cta-tbx__inner">
        <span class="cta-tbx__eyebrow">Primera consulta gratuita</span>
        <h2 class="cta-tbx__h2">¿Listo para<br />empezar?</h2>
        <p class="cta-tbx__sub">
          Cuéntanos tu proyecto y te decimos exactamente cómo podemos
          ayudarte. Sin compromisos. Sin letra pequeña.
        </p>
        <p class="cta-tbx__note">Solo una conversación para ver si encajamos.</p>

        <div class="cta-tbx__btns">
          <a href="tel:968636018" class="cta-tbx__btn cta-tbx__btn--gold">Habla con nosotros</a>
          <a href="#plan" class="cta-tbx__btn cta-tbx__btn--outline">Ver el Plan Emprendedor</a>
        </div>

        <a href="tel:968636018" class="cta-tbx__phone">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.44 2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
          <span>968 636 018</span>
        </a>
      </div>
    </div>

    <!-- Columna foto -->
    <div class="cta-tbx__photo" aria-hidden="true">
      <img src="../../../assets/images/tribulex/hero-office.png" alt="" class="cta-tbx__img" />
      <div class="cta-tbx__overlay"></div>
    </div>

  </section>

</body>
</html>
