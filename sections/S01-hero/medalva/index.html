<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S01 · Hero — Medalva</title>
  <link rel="stylesheet" href="../../../assets/css/base.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="font-set-3">

  <section class="hero-medalva theme-crimson">

    <!-- Orbs decorativos animados -->
    <div class="hero-medalva__orb hero-medalva__orb--light" aria-hidden="true"></div>
    <div class="hero-medalva__orb hero-medalva__orb--dark" aria-hidden="true"></div>

    <div class="hero-medalva__container">

      <div class="hero-medalva__text">
        <h1 class="hero-medalva__title text-balance">
          Medalva, asesoría para tu negocio en Sevilla
        </h1>
        <p class="hero-medalva__lead">
          Acompañamos a pymes y autónomos con documentación en
          <strong>orden, criterios claros y una forma de trabajar que se entiende.</strong>
        </p>
        <p class="hero-medalva__lead">
          <strong>Cuando hay un trámite o un imprevisto, respondemos.</strong>
        </p>
        <div class="hero-medalva__ctas">
          <a href="#contacto" class="hero-medalva__btn hero-medalva__btn--primary">Ponte en contacto</a>
          <a href="#servicios" class="hero-medalva__btn hero-medalva__btn--secondary">Ver nuestros servicios</a>
        </div>
      </div>

      <div class="hero-medalva__vsl">
        <div class="hero-medalva__vsl-frame" aria-hidden="true"></div>
        <div class="hero-medalva__video-wrap">
          <div class="hero-medalva__video">
            <img src="../../../assets/images/medalva/hero-team.jpg" alt="Equipo Medalva — Asesoría en Sevilla" class="hero-medalva__photo" />
            <button type="button" class="hero-medalva__play" aria-label="Reproducir vídeo">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
